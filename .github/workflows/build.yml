name: Build Windows EXE and Android APK

on:
  push:
    branches: [ main, qualitydll-android-mihomo-vpnservice ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Windows
      run: flutter build windows --release
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: build/windows/x64/runner/Release/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64'

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze and test
      run: |
        flutter analyze
        flutter test

    - name: Build Android APK
      run: flutter build apk --release

    - name: Boot Android emulator
      shell: bash
      run: |
        set -euo pipefail
        echo no | avdmanager create avd --force \
          --name mihomo-ci \
          --package 'system-images;android-35;google_apis;x86_64'
        emulator_bin="$ANDROID_HOME/emulator/emulator"
        if [[ ! -x "$emulator_bin" ]]; then
          echo "::error::Android emulator binary not found at $emulator_bin."
          ls -la "$ANDROID_HOME/emulator" || true
          exit 1
        fi
        "$emulator_bin" -avd mihomo-ci -no-window -gpu swiftshader_indirect \
          -no-snapshot -no-audio -no-boot-anim \
          > "$RUNNER_TEMP/mihomo-emulator.log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/mihomo-emulator.pid"

        if ! timeout 300s bash -c '
          until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do
            sleep 2
          done
        ' >/dev/null 2>&1; then
          echo "::error::Android emulator did not boot within 5 minutes."
          tail -n 80 "$RUNNER_TEMP/mihomo-emulator.log"
          exit 1
        fi

        adb shell settings put global window_animation_scale 0 >/dev/null 2>&1
        adb shell settings put global transition_animation_scale 0 >/dev/null 2>&1
        adb shell settings put global animator_duration_scale 0 >/dev/null 2>&1

    - name: Test installed Mihomo native loading
      run: cd android && ./gradlew connectedDebugAndroidTest --no-daemon

    - name: Stop Android emulator
      if: always()
      shell: bash
      run: |
        if [[ -f "$RUNNER_TEMP/mihomo-emulator.pid" ]]; then
          kill "$(cat "$RUNNER_TEMP/mihomo-emulator.pid")" 2>/dev/null || true
        fi
        adb -s emulator-5554 emu kill >/dev/null 2>&1 || true

    - name: Verify embedded Mihomo ABIs
      shell: bash
      run: |
        apk=build/app/outputs/flutter-apk/app-release.apk
        for abi in arm64-v8a armeabi-v7a x86_64; do
          unzip -Z1 "$apk" | grep -qx "lib/$abi/libclash.so"
          unzip -Z1 "$apk" | grep -qx "lib/$abi/libmihomo-jni.so"
        done

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-release
        path: build/app/outputs/flutter-apk/app-release.apk
