name: Build Windows EXE and Android APK

on:
  push:
    branches:
      - main
      - qualitydll-android-mihomo-vpnservice
      - qualitydll-sing-box-android-engine
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Windows
      run: flutter build windows --release
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: build/windows/x64/runner/Release/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Go for sing-box libbox
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Checkout pinned sing-box source
      uses: actions/checkout@v4
      with:
        repository: SagerNet/sing-box
        ref: v1.14.3
        path: .build/sing-box

    - name: Install gomobile bind tools
      run: |
        go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
        go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.13004108'

    - name: Build pinned sing-box libbox AAR
      shell: bash
      run: |
        set -euo pipefail
        cd .build/sing-box
        go run ./cmd/internal/build_libbox -target android
        mkdir -p ../../android/app/libs
        cp libbox.aar ../../android/app/libs/libbox.aar
        cp libbox-legacy.aar ../../android/app/libs/libbox-legacy.aar
        cd ../..
        sha256sum android/app/libs/libbox.aar android/app/libs/libbox-legacy.aar
        tar -czf sing-box-source-v1.14.3.tar.gz \
          --exclude=.git \
          -C .build sing-box

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze and test
      run: |
        flutter analyze
        flutter test

    - name: Build Android APK
      run: flutter build apk --release

    - name: Verify APK package, VPN service, native libraries, and load wiring
      shell: bash
      run: |
        set -euo pipefail
        apk=build/app/outputs/flutter-apk/app-release.apk
        aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
        badging="$("$aapt" dump badging "$apk")"
        if ! grep -Fq "package: name='dev.brew.brew'" <<<"$badging"; then
          echo "::error::APK package is not dev.brew.brew."
          exit 1
        fi

        manifest="$("$aapt" dump xmltree "$apk" AndroidManifest.xml)"
        for required in \
          "MihomoVpnService" \
          "android.permission.BIND_VPN_SERVICE" \
          "android.net.VpnService"; do
          if ! grep -Fq "$required" <<<"$manifest"; then
            echo "::error::APK manifest is missing $required."
            exit 1
          fi
        done

        for abi in arm64-v8a armeabi-v7a x86_64; do
          for library in libclash.so libmihomo-jni.so; do
            if ! unzip -Z1 "$apk" | grep -qx "lib/$abi/$library"; then
              echo "::error::APK is missing lib/$abi/$library."
              exit 1
            fi
          done
        done
        if ! unzip -Z1 "$apk" | grep -qx \
          'assets/flutter_assets/assets/images/brew_logo.png'; then
          echo "::error::APK is missing the supplied Brew logo asset."
          exit 1
        fi

        grep -Fq 'useLegacyPackaging = true' android/app/build.gradle.kts
        grep -Fq 'applicationInfo.nativeLibraryDir' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoRuntime.kt
        grep -Fq 'Clash.load(nativeLibraryDir.absolutePath)' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoRuntime.kt
        grep -Fq 'Clash.assertReady()' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoRuntime.kt
        grep -Fq '.put("home-dir", homeDir.absolutePath)' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq '.put("version", Build.VERSION.SDK_INT)' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq '.put("selected-map", JSONObject())' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq 'File(configPath).canonicalFile' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq 'CONFIG_FILE_NAME = "config.yaml"' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq 'prepareMihomoConfigFile(dataDir)' lib/state/app_state.dart
        grep -Fq "p.join(dataDirectory, 'home')" \
          lib/core/mihomo_config_path.dart
        grep -Fq 'await file.parent.create(recursive: true)' \
          lib/core/mihomo_config_path.dart
        grep -Fq 'prepareMihomoConfigFile' \
          test/core/mihomo_config_path_test.dart
        grep -Fq 'MihomoRuntime.load(this)' \
          android/app/src/main/kotlin/dev/brew/brew/MainActivity.kt
        grep -Fq 'MihomoRuntime.load(this)' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq 'EXTRA_SESSION_ID, sessionId' \
          android/app/src/main/kotlin/dev/brew/brew/MainActivity.kt
        grep -Fq 'EXTRA_SESSION_ID' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq 'activeSessionId == sessionId' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq 'if (activeSessionId == sessionId)' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq 'latestStartId == startId' \
          android/app/src/main/kotlin/dev/brew/brew/MihomoVpnService.kt
        grep -Fq 'startTimeout = const Duration(seconds: 40)' \
          lib/core/android_vpn.dart
        grep -Fq 'VPN cleanup failed' lib/core/android_vpn.dart
        grep -Fq 'waitForMihomoApi(api.version)' lib/state/app_state.dart
        test -f test/core/android_vpn_test.dart
        test -f test/core/mihomo_api_test.dart
        grep -Fq 'await _waitForApi(api)' lib/state/app_state.dart

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-release
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload sing-box source corresponding to generated libbox
      uses: actions/upload-artifact@v4
      with:
        name: sing-box-source-v1.14.3
        path: sing-box-source-v1.14.3.tar.gz
        if-no-files-found: error
