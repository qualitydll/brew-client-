name: Build Windows EXE and Android APK

on:
  push:
    branches: [ main, qualitydll-android-mihomo-vpnservice ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Windows
      run: flutter build windows --release
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: build/windows/x64/runner/Release/

  android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze and test
      run: |
        flutter analyze
        flutter test

    - name: Build Android APK
      run: flutter build apk --release

    - name: Test installed Mihomo native loading
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        disable-animations: true
        script: cd android && ./gradlew connectedDebugAndroidTest

    - name: Verify embedded Mihomo ABIs
      shell: bash
      run: |
        apk=build/app/outputs/flutter-apk/app-release.apk
        for abi in arm64-v8a armeabi-v7a x86_64; do
          unzip -Z1 "$apk" | grep -qx "lib/$abi/libclash.so"
          unzip -Z1 "$apk" | grep -qx "lib/$abi/libmihomo-jni.so"
        done

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-release
        path: build/app/outputs/flutter-apk/app-release.apk
