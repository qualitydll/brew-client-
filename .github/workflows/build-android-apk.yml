name: Build Android APK

on:
  push:
    branches: [android-apk-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render launcher icon
        run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/brew_icon.svg > assets/brew_icon.png

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name brew .

      - name: Configure Android launcher icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            image_path: "assets/brew_icon.png"
            adaptive_icon_background: "#171717"
            adaptive_icon_foreground: "assets/brew_icon.png"
          EOF
          dart run flutter_launcher_icons

      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          # Release builds need INTERNET explicitly; Flutter tooling's debug
          # manifest can otherwise mask a missing permission.
          if "android.permission.INTERNET" not in text:
              text = re.sub(
                  r"(<manifest\\b[^>]*>)",
                  r"\\1\\n    <uses-permission android:name=\"android.permission.INTERNET\" />",
                  text,
                  count=1,
              )

          # Make the application name and launcher icon explicit.
          app_match = re.search(r"<application\\b[^>]*>", text)
          if not app_match:
              raise SystemExit("Could not find <application> in AndroidManifest.xml")
          app = app_match.group(0)
          if re.search(r"android:label=\"[^\"]*\"", app):
              app = re.sub(r"android:label=\"[^\"]*\"", 'android:label="Brew"', app)
          else:
              app = app[:-1] + ' android:label="Brew">'
          if re.search(r"android:icon=\"[^\"]*\"", app):
              app = re.sub(r"android:icon=\"[^\"]*\"", 'android:icon="@mipmap/ic_launcher"', app)
          else:
              app = app[:-1] + ' android:icon="@mipmap/ic_launcher">'
          text = text[:app_match.start()] + app + text[app_match.end():]
          path.write_text(text)
          print("Manifest configured: INTERNET permission, Brew label, ic_launcher icon")
          PY
          grep -nE 'INTERNET|<application|android:label|android:icon' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Verify launcher resources
        run: |
          find android/app/src/main/res -path '*mipmap*' -type f -print
          test -n "$(find android/app/src/main/res -type f -name 'ic_launcher.png' -print -quit)"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brew-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
