name: Build Android APK with Mihomo

concurrency:
  group: brew-android-mihomo-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android-mihomo-integration
      - fix/android-vpnservice-mihomo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name brew .

      - name: Install embedded Mihomo Android bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/libs android/app/src/main/kotlin/com/example/brew
          curl --fail --location --retry 3 \
            https://github.com/oviron/libmihomo-android/releases/download/v0.3.5/libmihomo-android-v0.3.5.aar \
            --output android/app/libs/libmihomo-android-v0.3.5.aar
          test -s android/app/libs/libmihomo-android-v0.3.5.aar
          echo "41ddcce67de37f406377798c5adbc7ff925e6cd9cadbef3f187da3a03e564176  android/app/libs/libmihomo-android-v0.3.5.aar" | sha256sum --check
          cp tool/android/MainActivity.kt android/app/src/main/kotlin/com/example/brew/MainActivity.kt
          cp tool/android/BrewVpnService.kt android/app/src/main/kotlin/com/example/brew/BrewVpnService.kt
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          dependency = 'implementation(files("libs/libmihomo-android-v0.3.5.aar"))'
          if dependency not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit("Could not find dependencies block in app Gradle file")
              text = text.replace(marker, marker + "\n    " + dependency, 1)
          if "useLegacyPackaging" not in text:
              marker = "defaultConfig {"
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("Could not find defaultConfig block in app Gradle file")
              line_start = text.rfind("\n", 0, pos) + 1
              indent = text[line_start:pos]
              block = (
                  indent + "packaging {\n"
                  + indent + "    jniLibs {\n"
                  + indent + "        useLegacyPackaging = true\n"
                  + indent + "    }\n"
                  + indent + "}\n\n"
              )
              text = text[:line_start] + block + text[line_start:]
          path.write_text(text)
          print("Configured the pinned libmihomo-android AAR and JNI packaging")
          PY

      - name: Configure Android launcher icon
        run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/brew_icon.svg > assets/brew_icon.png
          flutter pub add --dev flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            image_path: "assets/brew_icon.png"
            adaptive_icon_background: "#171717"
            adaptive_icon_foreground: "assets/brew_icon.png"
          EOF
          dart run flutter_launcher_icons

      - name: Configure Android VPN manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          manifest_start = text.find("<manifest")
          manifest_end = text.find(">", manifest_start)
          if manifest_start < 0 or manifest_end < 0:
              raise SystemExit("Could not find <manifest> in AndroidManifest.xml")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_SYSTEM_EXEMPTED",
          ]
          insert = ""
          for permission in permissions:
              if permission not in text:
                  insert += f'\n    <uses-permission android:name="{permission}" />'
          if insert:
              text = text[:manifest_end + 1] + insert + text[manifest_end + 1:]

          app_start = text.find("<application")
          app_end = text.find(">", app_start)
          if app_start < 0 or app_end < 0:
              raise SystemExit("Could not find <application> in AndroidManifest.xml")
          app = text[app_start:app_end + 1]
          def set_attr(tag, name, value):
              prefix = name + '="'
              start = tag.find(prefix)
              if start < 0:
                  return tag[:-1] + f' {name}="{value}">'
              value_start = start + len(prefix)
              value_end = tag.find('"', value_start)
              return tag[:value_start] + value + tag[value_end:]
          app = set_attr(app, "android:label", "brew")
          app = set_attr(app, "android:icon", "@mipmap/ic_launcher")
          app = set_attr(app, "android:extractNativeLibs", "true")
          text = text[:app_start] + app + text[app_end + 1:]

          if "BrewVpnService" not in text:
              service = """
                  <service
                      android:name=".BrewVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="true"
                      android:foregroundServiceType="systemExempted">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
          """
              if "</application>" not in text:
                  raise SystemExit("Could not find </application> in AndroidManifest.xml")
              text = text.replace("</application>", service + "\n    </application>", 1)
          path.write_text(text)
          print("Configured permissions and Android VpnService")
          PY
          grep -nE 'INTERNET|FOREGROUND_SERVICE|BrewVpnService|BIND_VPN_SERVICE|PROPERTY_SPECIAL' android/app/src/main/AndroidManifest.xml

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Verify Android VPN integration
        run: |
          test -s android/app/libs/libmihomo-android-v0.3.5.aar
          grep -q 'BrewVpnService' android/app/src/main/AndroidManifest.xml
          grep -q 'libmihomo-android-v0.3.5.aar' android/app/build.gradle.kts
          grep -q 'class BrewVpnService' android/app/src/main/kotlin/com/example/brew/BrewVpnService.kt
          find android/app/src/main/res -path '*mipmap*' -type f -print
          test -n "$(find android/app/src/main/res -type f -name 'ic_launcher.png' -print -quit)"

      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brew-android-arm64-mihomo-vpn
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
